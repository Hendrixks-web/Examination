  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe-inspector/1.0.0/aframe-inspector.min.js"></script>
  <script>
    AFRAME.registerComponent("water-animation", {
      schema: {
        speed: { type: "number", default: 1 },
        amplitude: { type: "number", default: 0.03 },
      },
      init: function () {
        this.tickVal = 0;
        this.initialY = this.el.object3D.position.y;
      },
      tick: function (time, delta) {
        this.tickVal += (delta / 1000) * this.data.speed;
        var yOffset = Math.sin(this.tickVal * 2.5) * this.data.amplitude;
        this.el.object3D.position.y = this.initialY + yOffset;
        var color = new THREE.Color(0x00aaff);
        color.offsetHSL(0, 0, Math.sin(this.tickVal) * 0.02);
        this.el.setAttribute("material", "color", "#" + color.getHexString());
      },
    });
  </script>
